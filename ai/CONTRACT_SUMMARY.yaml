project: ICU Messages Ada
version_contract: Stable runtime release with GNAT/GPRbuild library/test verification
language: Ada 2022
purpose: Deterministic ICU-style catalog message rendering.
production_path: text/shard catalog -> parse + validate + compile once at load -> indexed (locale,key) lookup -> locale fallback -> public render -> structured public result
public_packages:
  - I18N
  - I18N.Runtime
  - I18N.Result
  - I18N.Diagnostics
  - I18N.Arguments
  - I18N.Locales
  - I18N.Plurals
canonical_catalog_format:
  type: line-oriented text
  default_locale: "default_locale = en"
  message_entry: "locale.key = ICU message"
  comments: "# at start of trimmed line"
  binary_catalogs: not shipped
runtime_loading:
  initialize: I18N.Runtime.Initialize (base catalog file)
  shard_load_file: I18N.Runtime.Load_File
  shard_load_text: I18N.Runtime.Load_Text
  legacy_append: I18N.Runtime.Load
  transactional: true
  non_destructive_on_failure: true
  duplicate_policy: [Reject_Duplicates, Keep_First, Override_Previous]
  load_status: [Loaded, Source_Not_Found, Invalid_Catalog, Duplicate_Rejected, Runtime_Invalid]
  load_result_counters: [Entries_Added, Entries_Replaced, Entries_Ignored]
  default_locale_adopted_when_unset: true
validation:
  validate_catalog_file: I18N.Runtime.Validate_Catalog_File
  validate_catalog_text: I18N.Runtime.Validate_Catalog_Text
  non_destructive: true
  diagnostics_include_line_numbers: true
resolution:
  resolve: I18N.Runtime.Resolve
  resolve_status: [Found, Missing_Key, Runtime_Invalid]
  renders_message: false
  requires_arguments: false
icu_subset:
  variables: true
  plural_branches_required: [other]
  plural_branches_optional: [one]
  select_branches: arbitrary validated identifiers (legacy male/female/other still work)
  arbitrary_select_branch_names: true
  selectordinal_branches_required: [other]
  selectordinal_branches_optional: [one, two, few]
  missing_category_branch_falls_back_to_other: true
plural_categories:
  package: I18N.Plurals
  categories: [Zero, One, Two, Few, Many, Other]
  cardinal_locales: [en, de, nl, da, es, it, fr, pt, ru, pl, cs, ar]
  ordinal_locales: [en, fr, it]
  fallback_rule: root (Other) for CJK and unsupported locales
  operands: integer-only
  render_uses_locale_aware_selection: true
locale_fallback:
  order: language-region -> language -> default locale
  missing_key_after_fallback: Missing_Key
argument_setters:
  string: I18N.Arguments.Set
  integer: I18N.Arguments.Set_Integer
  natural: I18N.Arguments.Set_Natural
  boolean: I18N.Arguments.Set_Boolean
  locale_aware: false
render_contract:
  normal_failures_raise: false
  result_type: I18N.Result.Render_Result
  public_render_materializes_result_text: true
  public_render_zero_allocation_api: false
  public_bounded_render: I18N.Runtime.Render_Into
  public_bounded_render_allocation_free: true
arguments_contract:
  type_is_limited: true
  whole_object_assignment: forbidden
  explicit_copy_operation: I18N.Arguments.Copy
  statuses:
    - Success
    - Missing_Key
    - Missing_Argument
    - Invalid_Argument
    - Formatting_Error
    - Execution_Error
    - Buffer_Overflow
    - Internal_Error
diagnostics:
  optional: true
  no_op_by_default: true
  changes_render_output: false
  callback_exceptions_escape: false
threading:
  initialized_runtime: read-only/shared rendering intended
allocation:
  initialization_may_allocate: true
  public_allocation_free_render_path: I18N.Runtime.Render_Into
  fixed_buffer_render_path_used_for_zero_allocation_checks: private child I18N.Runtime.Compatibility.Render_Into
internal_compiled_path:
  packages: [I18N.Compiler, I18N.Fast_Render, I18N.Render]
  status: regression-only legacy
  select_support: male/female/other only (no generalized branches)
  plural_ordinal_selection: locale-agnostic (one iff n=1; ordinal by 1/2/3)
  shares_other_fallback_policy_with_public_path: true
  authoritative_public_path: I18N.Runtime
forbidden_public_leaks:
  - parser cursor state
  - AST node access
  - compiler internals
  - IR opcode arrays
  - cache map internals
  - buffer internals
ada_private_internal_packages:
  - I18N.AST
  - I18N.Buffer
  - I18N.Cache
  - I18N.Compiled
  - I18N.Compiler
  - I18N.Errors
  - I18N.Fast_Render
  - I18N.Observability
  - I18N.Parser
  - I18N.Render
  - I18N.Runtime.Compatibility
  - I18N.Validation
api_visibility_enforced: Ada private child packages hide internal/regression units from ordinary downstream application imports.
release_verification_required:
  verified_status: release candidates require the core library build, test project build, and AUnit runner to pass
  verified_commands:
    - gprbuild -P i18n.gpr
    - cd tests && alr exec -- gprbuild -P tests.gpr
    - cd tests && ./bin/tests
  remaining_publication_checks:
    - gprbuild -P examples/examples.gpr
    - alr build
    - gnatdoc -P i18n.gpr
package_metadata:
  alire_manifest: alire.toml
  crate_name: i18n
  version: 1.0.0
  primary_project_file: i18n.gpr
  license: MIT
  toolchain_dependency: gnat >=12
  packaging_doc: docs/PACKAGING.md
argument_contract:
  arguments_are_limited_noncopyable: true
  mutation_api: Set/Clear
  render_usage: pass existing Arguments object to I18N.Runtime.Render
