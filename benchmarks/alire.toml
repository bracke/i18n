name = "i18n_benchmarks"
description = "Rendering benchmarks for the i18n crate"
version = "1.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/i18n"
tags = ["i18n", "benchmarks", "performance"]
project-files = ["benchmarks.gpr"]

executables = ["render_benchmarks"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
i18n = "*"

[[pins]]
i18n = { path = ".." }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share i18n object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
