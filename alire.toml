name = "i18n"
description = "Native Ada Unicode/CLDR internationalization platform"
version = "1.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/i18n"
long-description = "i18n is a native Ada 2022 implementation of the Unicode text algorithms and the CLDR formatting, names and data stack: locale identity and fallback, plural and ordinal classification, collation, segmentation, and formatting for numbers, dates, currency, units, durations, byte sizes, relative time and lists. It has no external runtime dependencies and generates its locale data from a checked, pinned CLDR and tzdb subset rather than reading a system library's. ICU-style message formatting is deliberately not here; it lives in the sibling messages crate, which is built on this one."
tags = ["i18n","unicode","cldr","locales"]
project-files = ["i18n.gpr"]

[[depends-on]]
gnat = ">=12"

#  src/i18n-cldr_data*.adb are generated build artifacts and are gitignored, so
#  a clone has the spec and no body. This regenerates them from whatever the
#  tree has -- pinned subset, vendored upstream JSON, or a fresh download -- and
#  costs ~3 ms once they exist. The orchestrator is a standalone Ada tool
#  (cldr/regen_tool/regenerate.adb): build it with plain gprbuild, then run it.
#  Both are plain executables -- no shell. See cldr/regen_tool and CLDR_DATA.md.
[[actions]]
type = "pre-build"
command = ["gprbuild", "-P", "cldr/regen_tool/regenerate.gpr", "-p", "-q"]

[[actions]]
type = "pre-build"
command = ["cldr/regen_tool/bin/regenerate"]

# The release gate is its own crate (check_i18n) with its own dependencies, so
# build it and run it in that directory, via two directory-scoped actions.
[[actions]]
type = "test"
command = ["alr", "-n", "build"]
directory = "check_i18n"

[[actions]]
type = "test"
command = ["./bin/check_i18n", "--no-upstream"]
directory = "check_i18n"
