name = "i18n"
description = "Native Ada Unicode/CLDR internationalization platform"
version = "1.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/i18n"
tags = ["messages","i18n","locales"]
project-files = ["i18n.gpr"]

[configuration.variables]
#  Which locales the generated CLDR tables carry. "all" is every locale in the
#  pinned subset; otherwise a comma-separated list, e.g. "en,de,fr". The
#  default is everything -- narrowing is the consuming application's choice.
locales = { type = "String", default = "all" }

[[depends-on]]
gnat = ">=12"

#  src/i18n-cldr_data*.adb are generated build artifacts and are gitignored, so
#  a clone has the spec and no body. This regenerates them from whatever the
#  tree has -- pinned subset, vendored upstream JSON, or a fresh download -- and
#  costs ~3 ms once they exist. See cldr/regenerate.sh and cldr/CLDR_DATA.md.
[[actions]]
type = "pre-build"
command = ["sh", "cldr/regenerate.sh"]

[[actions]]
type = "test"
command = ["sh", "-c", "cd check_i18n && alr build && ./bin/check_i18n --skip-alr-test"]
