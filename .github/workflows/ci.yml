name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-ci:
    name: Linux CI checks
    runs-on: ubuntu-latest
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Check out i18n
        uses: actions/checkout@v7
        with:
          path: i18n

      - name: Check out project_tools sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/project_tools
          path: project_tools

      # The CLDR regeneration tooling (cldr_tools) downloads and unpacks upstream
      # over HTTPS, so it depends on httpclient (which pulls zlib + cryptolib).
      # The library's pre-build regeneration builds those tools, so their sibling
      # checkouts must be present or `alr build` fails resolving the path pins.
      - name: Check out httpclient sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/httpclient
          path: httpclient

      - name: Check out zlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/zlib
          path: zlib

      - name: Check out cryptolib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/cryptolib
          path: cryptolib

      # download_tzdb untars with tarlib and runs the tz scripts through awklib
      # (which is built on regexp).
      - name: Check out tarlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/tarlib
          path: tarlib

      - name: Check out awklib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/awklib
          path: awklib

      - name: Check out regexp sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/regexp
          path: regexp

      # The CLDR import tools ask hostkit for the host's scratch directory
      # (a real temp path on Windows, not a POSIX "/tmp" guess).
      - name: Check out hostkit sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/hostkit
          path: hostkit

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Install workflow dependencies
        run: |
          sudo apt-get update
          # libssl-dev: httpclient's TLS bridge (the CLDR downloader links it).
          sudo apt-get install -y libssl-dev
          sudo apt-get install -y libaunit-dev || sudo apt-get install -y libaunit22-dev || sudo apt-get install -y libaunit24-dev

      - name: Build library package
        working-directory: i18n
        run: alr build

      - name: Build AUnit tests
        working-directory: i18n/tests
        # tests/ is its own Alire root; `alr build` generates its gitignored
        # config/tests_config.gpr (which tests.gpr withs) before building. A raw
        # `gprbuild -P tests.gpr` skips that generation and fails on the missing file.
        run: alr build

      - name: Run AUnit tests
        working-directory: i18n/tests
        run: alr exec -- ./bin/tests

      - name: Install GNATdoc
        # gnatdoc is not part of the gnat_native toolchain, so a bare
        # `alr exec -- gnatdoc` fails with "Executable not found in PATH".
        # Install the prebuilt crate as a tool and put ~/.alire/bin on PATH;
        # `alr exec` inherits it, so the next step resolves gnatdoc.
        run: |
          alr install gnatdoc_bin
          # The release checker also runs GNATprove, which is an Alire crate
          # rather than a toolchain component, so it installs the same way.
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Generate GNATdoc
        working-directory: i18n
        run: alr exec -- gnatdoc -P i18n.gpr

      - name: Build release checker
        working-directory: i18n/check_i18n
        run: alr build

      - name: Run project_tools release checker
        working-directory: i18n/check_i18n
        # cldr/upstream/ and the artifacts derived from it are untracked (the
        # vendored CLDR tree is about a gigabyte), so a fresh checkout cannot
        # satisfy those file requirements. --no-upstream drops exactly those and
        # reports the count; every other release gate still runs here.
        run: ./bin/check_i18n --skip-alr-test --no-upstream

      - name: Run Alire packaging test action
        working-directory: i18n
        run: alr test
