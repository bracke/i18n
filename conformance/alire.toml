name = "i18n_conformance"
description = "ICU conformance checks for the i18n crate"
version = "1.1.0"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/i18n"
tags = ["i18n", "conformance", "icu", "checks"]
project-files = ["conformance.gpr"]

executables = ["check_conformance"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
i18n = "*"

[[depends-on]]
project_tools = "*"

[[pins]]
i18n = { path = ".." }
project_tools = { path = "../../project_tools" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share i18n object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
